name: regenerate-image

# Builds the mirror-regeneration image the homelab CronJob runs
# (deploy/k8s/regenerate-cronjob.yaml) and pushes it to ghcr.io.
# The CronJob pulls the `main` tag on every run, so merging is deploying.
# Pull requests only build it, so a broken image is caught before merge.

on:
  push:
    branches: [main]
    paths:
      - src/**
      - pyproject.toml
      - deploy/regenerate.sh
      - deploy/Dockerfile.regenerate
      - .github/workflows/regenerate-image.yml
  pull_request:
    paths:
      - src/**
      - pyproject.toml
      - deploy/regenerate.sh
      - deploy/Dockerfile.regenerate
      - .github/workflows/regenerate-image.yml
  workflow_dispatch:

concurrency:
  group: regenerate-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.regenerate
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/knesset-utils-regenerate:main
            ghcr.io/${{ github.repository_owner }}/knesset-utils-regenerate:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
