name: regenerate-mirror

# Rebuilds the mirror from scratch and publishes it only once it is complete.
#
# This replaced the incremental sync: LastUpdatedDate is not a reliable change
# signal in this API. A 631,655-row MkId remap in KNS_PlenumVoteResult landed
# with no timestamp change, KNS_PlmSessionItem's Id is a row number that gets
# renumbered upstream, and deletions never show up at all. So the mirror is
# rebuilt rather than patched.
#
# A rebuild is ~34k requests. The Knesset firewall blocks an IP for ~2 min once
# it sends more than roughly 1,000 requests per 2 min, and holds runner (Azure)
# IPs to less than that, so the crawl is paced at MAX_RATE and may not fit in one
# job. It therefore runs with a time budget and checkpoints every chunk into the
# sqlite file (_sync_chunks); the partial rebuild is parked in the `rebuild-wip`
# release and the next run continues it. `latest` -- what the MCP server serves --
# only moves when a rebuild is finished, so it is always a complete mirror.
#
# MANUAL FALLBACK ONLY. Since 2026-10-06 the Knesset API geo-blocks non-Israeli
# IPs (303 -> maintenance-page-geo), which includes GitHub-hosted runners. The
# daily rebuild now runs as a CronJob on the homelab cluster
# (deploy/k8s/regenerate-cronjob.yaml). Both run deploy/regenerate.sh; this one
# is only useful again if the geo-block lifts and the cluster is down for long.

on:
  workflow_dispatch:

concurrency:
  group: regenerate-mirror
  cancel-in-progress: false

permissions:
  contents: write           # create/upload releases

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      WIP_TAG: rebuild-wip  # a runner's disk does not survive the job; park partials here
      ZSTD_LONG: "27"        # must equal MIRROR_ZSTD_LONG in render.yaml
      WORKERS: "8"
      MAX_RATE: "2"          # requests/s; halved automatically on a firewall block
      RUNTIME_MIN: "270"     # leaves room under timeout-minutes for compress + upload
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -e "."

      - name: Ensure zstd
        run: zstd --version || (sudo apt-get update && sudo apt-get install -y zstd)

      - name: Regenerate (crawl; publish if complete, else park in rebuild-wip)
        run: bash deploy/regenerate.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerate-logs-${{ github.run_id }}
          path: sync.log
          if-no-files-found: warn
