name: sync-mirror

# Daily incremental refresh of the SQLite mirror.
#
# Pulls the current mirror from the moving `latest` release, runs an incremental
# sync against it (~20 min; the 14 h from-scratch seed is done locally and never
# here -- GitHub-hosted runners cap at 6 h), then republishes it. The release
# asset IS the state store: db/sync.py checkpoints every page and watermark into
# the _sync_state table inside the sqlite file.
#
# Prereq: the `latest` release with `knesset_mirror.sqlite.zst` must already
# exist (created once locally from the seeded mirror -- see README "Deployment").

on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC daily
  workflow_dispatch:

concurrency:
  group: sync-mirror
  cancel-in-progress: false

permissions:
  contents: write           # create/upload releases

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      ASSET: knesset_mirror.sqlite.zst
      DB: knesset_mirror.sqlite
      ZSTD_LONG: "27"        # must equal MIRROR_ZSTD_LONG in render.yaml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e "."

      - name: Ensure zstd
        run: zstd --version || (sudo apt-get update && sudo apt-get install -y zstd)

      - name: Download current mirror from the 'latest' release
        run: |
          if ! gh release download latest --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir .; then
            echo "::error::No 'latest' release asset '$ASSET'. Seed it once locally first (see README)."
            exit 1
          fi
          zstd -d --long=$ZSTD_LONG "$ASSET" -o "$DB"
          ls -la "$DB"

      - name: Incremental sync
        id: sync
        continue-on-error: true
        run: knesset-utils sync --db "$DB" --log sync.log --fail-on-any

      - name: FK integrity report (non-blocking)
        continue-on-error: true
        run: knesset-utils validate-fks --db "$DB" | tee fk_report.txt

      - name: Recompress
        run: |
          rm -f "$ASSET"
          zstd -19 --long=$ZSTD_LONG -T0 "$DB" -o "$ASSET"
          ls -la "$ASSET"

      - name: Publish (move 'latest' + keep a dated history release)
        run: |
          DATE=$(date -u +%Y-%m-%d)
          NOTES="sync $(date -u +%FT%TZ) | sync step: ${{ steps.sync.outcome }}"
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create latest --repo "$GITHUB_REPOSITORY" --title "latest mirror" --notes "moving pointer"
          gh release upload latest "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit   latest --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          gh release create "mirror-$DATE" "$ASSET" --repo "$GITHUB_REPOSITORY" --title "mirror $DATE" --notes "$NOTES" \
            || gh release upload "mirror-$DATE" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-logs-${{ github.run_id }}
          path: |
            sync.log
            fk_report.txt
          if-no-files-found: warn

      - name: Nudge Render to pick up the new mirror (optional)
        if: ${{ steps.sync.outcome == 'success' }}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK" && echo "deploy hook triggered"
          else
            echo "RENDER_DEPLOY_HOOK not set; server's 6h refresh thread will pick it up"
          fi

      - name: Fail the job if the sync step failed
        if: ${{ steps.sync.outcome == 'failure' }}
        run: |
          echo "::error::sync exited non-zero; the partially-synced mirror was still published"
          exit 1
