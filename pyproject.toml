[project]
name = "knesset_utils"
version = "0.1.0"
description = "SQLite mirror of the Knesset OData API, plus an MCP server for statistical analysis over the mirror."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
knesset-utils = "knesset_utils.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
